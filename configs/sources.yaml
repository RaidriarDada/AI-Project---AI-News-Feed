rss:
  sources:
    # -------------------------
    # Official AI lab / company blogs
    # -------------------------
    - name: Google AI Blog
      url: https://blog.google/technology/ai/rss/
      enabled: true
      category: ai_lab
      priority: high

    - name: Microsoft AI Blog
      url: https://blogs.microsoft.com/ai/feed/
      enabled: true
      category: ai_lab
      priority: high


    - name: Hugging Face Blog
      url: https://huggingface.co/blog/feed.xml
      enabled: true
      category: open_source_ai
      priority: high

    - name: NVIDIA Developer Blog
      url: https://developer.nvidia.com/blog/feed/
      enabled: true
      category: ai_infra
      priority: high

    - name: GitHub Blog
      url: https://github.blog/feed/
      enabled: true
      category: dev_tools
      priority: medium

    - name: GitHub Changelog
      url: https://github.blog/changelog/feed/
      enabled: true
      category: dev_tools
      priority: high

arxiv:
  enabled: true
  api_url: https://export.arxiv.org/api/query
  priority: medium
  max_results: 40
  categories:
    - cs.CL
    - cs.CV
    - cs.AI
    - cs.LG

github:
  enabled: true
  api_url: https://api.github.com/search/repositories
  priority: medium
  max_results_per_query: 10
  min_stars: 500
  queries:
    - llm
    - langgraph
    - mcp
    - vision language model

huggingface:
  enabled: true
  priority: medium
  max_results_per_query: 10
  filters:
    - text-generation
    - image-text-to-text
    - video-text-to-text